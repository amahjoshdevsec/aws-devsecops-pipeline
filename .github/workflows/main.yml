name: Deploy DevSecOps Pipeline

on:
    push:
      branches:
        - main
    workflow_dispatch:

jobs:
    terraform-lint:
        uses: ./.github/workflows/terraform-lint.yml
        permissions:
            contents: read
    terraform-apply-eks:
        needs: terraform-lint
        uses: ./.github/workflows/terraform-apply-eks.yml
        permissions:
            contents: read
        secrets: inherit
    terraform-apply-pipelines:
        needs: terraform-apply-eks
        uses: ./.github/workflows/terraform-apply-pipelines.yml
        permissions:
            contents: read
        secrets: inherit
